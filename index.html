<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>无名簿</title>
    <link rel="icon" type="image/png" href="/wumingbu/assets/vfx/spark-256.png" />
    <script type="module" crossorigin src="/wumingbu/assets/index-D8MnRcH-.js"></script>
    <link rel="stylesheet" crossorigin href="/wumingbu/assets/index-C_Ykbwsk.css">
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="landscape-notice" role="alert" aria-live="polite">
      <div class="rotate-phone" aria-hidden="true"></div>
      <h1>请横屏游玩</h1>
      <p>将手机横过来，继续奈何桥之行。</p>
    </div>
    <div id="hud">
      <section id="player-status" aria-label="命灯与魂火">
        <div class="life-heading"><span class="life-title">命灯</span><output id="hp-value" aria-label="当前生命">100 / 100</output></div>
        <div id="hp" role="progressbar" aria-label="生命值" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="hp-fill"></div></div>
        <div class="status-bottom"><div id="souls">魂火 0</div><div id="styles" aria-label="已使用招式"><span>近</span><span>锁</span><span>绞</span><span>勾</span></div></div>
      </section>
      <div id="combo" aria-label="连势与收魂"></div>
      <div id="hint">WASD 移动 · 鼠标左键 攻击 · 空格 冲刺 · 右键 链钩 · E 绞索 · 数字键 1/2 魂技 · 中键拖动观察 · C 镜头复位 · Esc 暂停</div>
    </div>
    <div id="touch">
      <div id="stick"><div id="knob"></div></div>
      <button class="tbtn" id="t-attack" aria-label="攻击"><span>击</span></button>
      <button class="tbtn" id="t-dash" aria-label="冲刺"><span>闪</span></button>
      <button class="tbtn" id="t-hook" aria-label="链钩"><span>钩</span></button>
      <button class="tbtn" id="t-pull" aria-label="收紧"><span>收</span></button>
      <button id="t-pause" aria-label="暂停"><span>‖</span></button>
      <button class="tbtn" id="t-talk" aria-label="交互"><span>谈</span></button>
      <button class="tsbtn t-skill-a" id="t-skill1" type="button" data-label-base="魂技一" aria-label="魂技一：空槽" aria-disabled="true" disabled>
        <span class="ts-name">空槽</span><span class="ts-cd" aria-hidden="true"></span>
      </button>
      <button class="tsbtn t-skill-b" id="t-skill2" type="button" data-label-base="魂技二" aria-label="魂技二：空槽" aria-disabled="true" disabled>
        <span class="ts-name">空槽</span><span class="ts-cd" aria-hidden="true"></span>
      </button>
    </div>
  </body>
</html>
